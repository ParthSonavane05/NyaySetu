name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: mypy app/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nyaysetu
          POSTGRES_PASSWORD: nyaysetu_dev
          POSTGRES_DB: nyaysetu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nyaysetu"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://nyaysetu:nyaysetu_dev@localhost:5432/nyaysetu_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-not-for-production
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ENDPOINT_URL: http://localhost:9000
      NYAYSETU_ENV: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --tb=short

  alembic-heads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Check single Alembic head
        run: |
          heads=$(alembic heads 2>/dev/null | wc -l)
          if [ "$heads" -gt 1 ]; then
            echo "ERROR: Multiple Alembic heads detected"
            alembic heads
            exit 1
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://nyaysetu:nyaysetu_dev@localhost:5432/nyaysetu
          SECRET_KEY: dummy
          S3_ACCESS_KEY: dummy
          S3_SECRET_KEY: dummy

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, alembic-heads]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nyaysetu-api:ci .
